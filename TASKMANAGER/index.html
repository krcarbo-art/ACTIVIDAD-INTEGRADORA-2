<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager Gestión de Tareas</title>
    <link rel="stylesheet" href="CSS/styles.css" />

    <script type="module" src="js/script.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js")
                    .then(function () {
                        console.log("Modo offline activado");
                    })
                    .catch(function (error) {
                        console.error("Error al activar modo offline:", error);
                    });
            });
        }
    </script>
</head>

<body>
    <header>
        <h1>TaskManager</h1>
        <p>Aplicación de Gestión de Tareas</p>
    </header>

    <main>
        <h2>Mis tareas</h2>

        <!-- Buscar tareas -->
        <label for="buscar-tarea">Buscar tarea:</label>
        <input type="search" id="buscar-tarea" placeholder="Buscar por nombre">

        <!-- Filtrar tareas por estado -->
        <label for="filtro-estado">Filtrar tareas:</label>
        <select id="filtro-estado">
            <option value="todas">Todas</option>
            <option value="pendientes">Pendientes</option>
            <option value="completadas">Completadas</option>
        </select>

        <!-- Ordenar tareas -->
        <label for="orden-tareas">Ordenar por:</label>
        <select id="orden-tareas">
            <option value="recientes">Más recientes</option>
            <option value="antiguas">Más antiguas</option>
            <option value="prioridad">Prioridad</option>
        </select>

        <!-- Estadísticas -->
        <section id="estadisticas">
            <h3>Resumen de tareas</h3>
            <p>Total: <strong id="total-tareas">0</strong></p>
            <p>Pendientes: <strong id="tareas-pendientes">0</strong></p>
            <p>Completadas: <strong id="tareas-completadas">0</strong></p>
        </section>

        <!-- Formulario para agregar tareas -->
        <form id="form-tarea">
            <label for="titulo-tarea">Nombre de la tarea:</label>
            <input type="text" id="titulo-tarea" placeholder="Escribe una nueva tarea" required>

            <!-- Prioridad de la tarea -->
            <label for="prioridad-tarea">Prioridad:</label>
            <select id="prioridad-tarea">
                <option value="media">Media</option>
                <option value="alta">Alta</option>
                <option value="baja">Baja</option>
            </select>

            <button type="submit">Agregar tarea</button>
        </form>

        <!-- Lista de tareas -->
        <ul id="lista-tareas"></ul>
    </main>

</body>

</html>
