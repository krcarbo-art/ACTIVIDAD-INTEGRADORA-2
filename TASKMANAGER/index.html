<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager Gestión de Tareas</title>
    <link rel="stylesheet" href="CSS/styles.css" />

    <script type="module" src="js/script.js"></script>
</head>

<body>
    <header>
        <h1>TaskManager</h1>
        <p>Aplicación de Gestión de Tareas</p>
    </header>

    <main>
        <h2>Mis tareas</h2>

        <!-- Buscar tareas -->
        <label for="buscar-tarea">Buscar tarea:</label>
        <input type="search" id="buscar-tarea" placeholder="Buscar por nombre">

        <!-- Filtrar tareas por estado -->
        <label for="filtro-estado">Filtrar tareas:</label>
        <select id="filtro-estado">
            <option value="todas">Todas</option>
            <option value="pendientes">Pendientes</option>
            <option value="completadas">Completadas</option>
        </select>

        <!-- Formulario para agregar tareas -->
        <form id="form-tarea">
            <label for="titulo-tarea">Nombre de la tarea:</label>
            <input type="text" id="titulo-tarea" placeholder="Escribe una nueva tarea">

            <button type="submit">Agregar tarea</button>
        </form>

        <!-- Lista de tareas -->
        <ul id="lista-tareas"></ul>
    </main>

</body>

</html>
